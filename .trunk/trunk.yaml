# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.29.0
repo:
  trunk_branch: dev
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - actionlint@1.7.12
    - checkov@3.4.3
    - clippy@1.100.0
    - git-diff-check
    - grype@0.121.3
    - markdownlint@0.50.0
    - osv-scanner@2.7.1
    - pinact@4.1.1
    - prettier@3.9.10
    - rustfmt@1.100.0
    - svgo@4.1.0
    - taplo@0.10.0
    - trufflehog@3.99.8
    - yamllint@1.38.0
  ignore:
    # The kernel builds only for aarch64-unknown-none, and the SDK, demos and
    # test fixtures only for wasm32: `cargo xtask clippy` lints them with the
    # right targets.
    - linters: [clippy]
      paths:
        - kernel/**
        - sdk/**
        - demos/**
        - crates/kalium-wasm/tests/fixtures/**
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
