name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host-tests:
    name: Host tests, clippy, fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (host crates)
        run: cargo clippy --workspace --exclude kalium-kernel --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test

  boot-test:
    name: Boot test on QEMU (aarch64 virt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm
      - uses: Swatinem/rust-cache@v2
      - name: Build SDK examples (wasm32)
        run: cargo xtask wasm
      - name: Build kernel (aarch64-unknown-none)
        run: cargo xtask build
      - name: Boot test
        run: cargo xtask test
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kalium-aarch64
          path: target/aarch64-unknown-none/release/kalium
