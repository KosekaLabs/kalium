[package]
name = "kalium-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "kalium"
path = "src/main.rs"
test = false
bench = false

[features]
# HAL-only boot test: bring the hardware up, take ten timer ticks, exit 0.
# No boot image is embedded and no Wasm runs. `cargo xtask boot-test`.
boot-only = []
# Run the HAL hardening self-test (`kalium_hal::selftest::run`) before the
# boot-only tick loop or the scenario. `cargo xtask selftest`.
hal-selftest = ["kalium-hal/hal-selftest"]

[dependencies]
kalium-abi.workspace = true
kalium-wasm.workspace = true
kalium-hal.workspace = true
kalium-mm.workspace = true
kalium-cap.workspace = true
kalium-ipc.workspace = true
kalium-sched.workspace = true
